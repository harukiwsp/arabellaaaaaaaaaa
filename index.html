    <!-- Owner panel -->
    <aside class="owner edit-only" id="owner" hidden>
      <div class="owner-head">
        <button class="owner-toggle" id="owner-toggle" aria-expanded="true">✿ Decorate the valley</button>
        <button class="close owner-close" id="owner-close" type="button" aria-label="Close decorate panel">×</button>
      </div>
      <div class="owner-body">
        <p class="owner-note">You're in decorate mode. Tap any glowing lily to add a photo. She'll see the valley without these tools.</p>
        <label class="field"><span>Her name</span><input id="cfg-name" maxlength="60" /></label>
        <label class="field"><span>Birthday letter</span><textarea id="cfg-message" rows="6" maxlength="3000"></textarea></label>
        <button class="btn btn-primary" id="cfg-save">Save name &amp; letter</button>
        <button class="btn btn-primary" id="add-lilies" type="button">✚ Add 12 more lilies</button>
        <button class="btn song-btn" id="owner-playlist" type="button">♫ Edit our playlist</button>
        <a class='btn' href='/qr' rel='noopener' target='_blank'>♡ Get the heart QR code</a>
      </div>
    </aside>
